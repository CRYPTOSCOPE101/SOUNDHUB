# fly.toml — SoundHub backend on Fly.io
app = "soundhub-backend"

[build]

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true

[checks]
  [checks.health]
    port = 8000
    type = "http"
    interval = "10s"
    timeout = "2s"
    path = "/api/health"

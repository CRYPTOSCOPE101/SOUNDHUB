# fly.toml — SoundHub backend on Fly.io
# Generated by Codebuff. `fly launch --no-deploy` reads this file,
# or use `fly deploy` directly after creating the app + volume.

app = "soundhub-backend"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  SOUNDHUB_DATA_DIR = "/data"
  SOUNDHUB_DATABASE_URL = "sqlite:////data/soundhub.db"
  SOUNDHUB_FRONTEND_URL = "https://soundhub-app.vercel.app"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[mounts]]
  source = "soundhub_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"

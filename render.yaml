# render.yaml — SoundHub backend on Render
# One-click: Render dashboard → New → Blueprint → select soundXlab/SoundHub.
# Note: the Free instance type has an ephemeral filesystem — SQLite and
# uploaded blobs reset on restart/spin-down. Upgrade to a paid instance +
# persistent disk for durable data.
services:
  - type: web
    name: soundhub-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    # Seed is idempotent (skips existing data), so the deployed site always
    # has the demo user (demo/demo123) + Neon Dreams project on first boot.
    startCommand: sh -c "python -m scripts.seed_demo && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /api/health
    envVars:
      - key: SOUNDHUB_FRONTEND_URL
        value: https://soundhub-app.vercel.app
      - key: SOUNDHUB_CORS_ORIGINS
        value: https://soundhub-app.vercel.app
      - key: SOUNDHUB_ENV
        value: production
      - key: SOUNDHUB_SECRET_KEY
        generateValue: true
